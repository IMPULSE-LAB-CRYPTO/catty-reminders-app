name: Deploy
on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remote Docker Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          username: ilya
          port: 3120
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ilya/catty-reminders-app
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            # Экспортируем данные для compose
            export APP_IMAGE="ghcr.io/$OWNER/catty-reminders-app:latest&quot;
            export DEPLOY_REF="${{ github.sha }}"
            export MYSQL_ROOT_PASSWORD=mypass
            export MYSQL_DATABASE=catty_reminders

            # Логин и обновление
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose up -d --pull always --force-recreate --remove-orphans

            # Гарантируем наличие пользователя для бота после пересоздания базы
            sleep 15
            docker exec catty_db mysql -u root -pmypass catty_reminders -e "INSERT IGNORE INTO users (username, password) VALUES ('tester', 'foobar123');"
