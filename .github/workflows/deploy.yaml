name: Deploy
on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Remote Docker Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          username: ilya
          port: 3120
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ilya/catty-reminders-app
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            # Передаем всё через экспорт
            export APP_IMAGE="ghcr.io/$OWNER/catty-reminders-app:latest&quot;
            export DEPLOY_REF="${{ github.sha }}"
            export APP_CONTAINER_NAME=catty-app
            export DB_CONTAINER_NAME=catty_db
            export MYSQL_ROOT_PASSWORD=mypass
            export MYSQL_USER=user
            export MYSQL_PASSWORD=mypass
            export MYSQL_DATABASE=catty_reminders
            export APP_PORT=8181
            export DB_PORT=3306

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Принудительное пересоздание
            docker compose up -d --pull always --remove-orphans --force-recreate

            # Добавление пользователя для тестов бота
            sleep 15
            docker exec catty_db mysql -u root -pmypass catty_reminders -e "INSERT IGNORE INTO users (username, password) VALUES ('tester', 'foobar123');"
