name: Deploy
on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remote Docker Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          username: ilya
          port: 3120
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Переходим в рабочую папку
            cd /home/ilya/catty-compose

            # Принудительно приводим логин к нижнему регистру
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')

            # Экспортируем переменные напрямую для Docker Compose
            export APP_IMAGE="ghcr.io/$OWNER/$REPO:latest&quot;
            export DEPLOY_REF="${{ github.sha }}"

            # Переменные для базы и портов (чтобы не зависеть от старого .env)
            export MYSQL_ROOT_PASSWORD=mypass
            export MYSQL_DATABASE=catty_reminders
            export APP_PORT=8181
            export DB_PORT=3306
            export DB_CONTAINER_NAME=catty_db
            export APP_CONTAINER_NAME=catty-app

            # Авторизация
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Деплой: тянем образ всегда, пересоздаем контейнер всегда
            docker compose -f docker-compose.yaml up -d --pull always --force-recreate --remove-orphans

            # Очистка
            docker image prune -f
