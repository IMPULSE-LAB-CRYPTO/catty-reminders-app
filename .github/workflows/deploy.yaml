name: Deploy
on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          username: ilya
          port: 3120
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Переходим в папку, где лежит docker-compose.yaml
            cd /home/ilya/catty-reminders-app

            # 2. Экспортируем данные напрямую
            export DEPLOY_REF="${{ github.sha }}"
            export APP_IMAGE="ghcr.io/impulse-lab-crypto/catty-reminders-app:latest&quot;

            # 3. Полный сброс (удаляем контейнеры и старый образ)
            docker compose down --remove-orphans
            docker rmi $APP_IMAGE || true

            # 4. Запуск с новым SHA
            # Мы передаем DEPLOY_REF прямо в команду
            DEPLOY_REF=${{ github.sha }} docker compose up -d --pull always --force-recreate

            # 5. Инициализация базы (чтобы точно был tester)
            sleep 15
            docker exec catty_db mysql -u root -pmypass catty_reminders -e "
            CREATE TABLE IF NOT EXISTS users (username VARCHAR(255) PRIMARY KEY, password VARCHAR(255));
            INSERT IGNORE INTO users VALUES ('tester', 'foobar123');
            INSERT IGNORE INTO users VALUES ('heisenberg', 'P@ssw0rd');"
